<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="1240" height="700" fill="#ffffff"/>

  <text x="20" y="30" font-size="20" font-weight="700" fill="#1e293b">Q2(a) Multimedia Architecture — User Journey &amp; Media Map</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- main flow line -->
  <line x1="130" y1="330" x2="1120" y2="330" stroke="#c7d2fe" stroke-width="3"/>

  <!-- 1. Hero -->
  <g>
    <rect x="20" y="280" width="150" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="95" y="315" font-size="14" font-weight="700" text-anchor="middle" fill="#1e293b">Hero</text>
    <text x="95" y="335" font-size="12" text-anchor="middle" fill="#4f46e5">Photograph</text>
    <text x="95" y="355" font-size="11" text-anchor="middle" fill="#64748b">Award photo =</text>
    <text x="95" y="368" font-size="11" text-anchor="middle" fill="#64748b">instant proof</text>
  </g>
  <line x1="170" y1="330" x2="215" y2="330" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Intro -->
  <g>
    <rect x="220" y="280" width="150" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="295" y="315" font-size="14" font-weight="700" text-anchor="middle" fill="#1e293b">Intro</text>
    <text x="295" y="335" font-size="12" text-anchor="middle" fill="#64748b">Text</text>
    <text x="295" y="355" font-size="11" text-anchor="middle" fill="#64748b">Orients visitor</text>
    <text x="295" y="368" font-size="11" text-anchor="middle" fill="#64748b">to "why"</text>
  </g>
  <line x1="370" y1="330" x2="415" y2="330" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Timeline (branches up to two hackathon nodes) -->
  <g>
    <rect x="420" y="280" width="170" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="505" y="310" font-size="14" font-weight="700" text-anchor="middle" fill="#1e293b">Timeline</text>
    <text x="505" y="330" font-size="12" text-anchor="middle" fill="#4f46e5">Interactive tabs</text>
    <text x="505" y="350" font-size="11" text-anchor="middle" fill="#64748b">Self-select relevant</text>
    <text x="505" y="363" font-size="11" text-anchor="middle" fill="#64748b">hackathon, skip other</text>
  </g>

  <!-- branch stem up from Timeline -->
  <line x1="505" y1="280" x2="505" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="505" y1="180" x2="440" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="505" y1="180" x2="575" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- NASA branch node (left) -->
  <rect x="290" y="140" width="150" height="80" rx="10" fill="#ecfeff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="365" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1e293b">NASA Space Apps</text>
  <text x="365" y="185" font-size="11" text-anchor="middle" fill="#64748b">Team, tech, outcome</text>
  <text x="365" y="200" font-size="11" text-anchor="middle" fill="#64748b">+ GitHub / video links</text>

  <!-- HackWknd branch node (right) -->
  <rect x="580" y="140" width="150" height="80" rx="10" fill="#ecfeff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="655" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1e293b">HackWknd</text>
  <text x="655" y="185" font-size="11" text-anchor="middle" fill="#64748b">Team, tech, outcome</text>
  <text x="655" y="200" font-size="11" text-anchor="middle" fill="#64748b">+ Figma prototype link</text>

  <line x1="590" y1="330" x2="635" y2="330" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Video -->
  <g>
    <rect x="640" y="280" width="150" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="715" y="310" font-size="14" font-weight="700" text-anchor="middle" fill="#1e293b">Team presentation</text>
    <text x="715" y="330" font-size="12" text-anchor="middle" fill="#4f46e5">Embedded video</text>
    <text x="715" y="350" font-size="11" text-anchor="middle" fill="#64748b">Judges' own pitch,</text>
    <text x="715" y="363" font-size="11" text-anchor="middle" fill="#64748b">tone + context</text>
  </g>

  <!-- rejected element, below Video, dashed red -->
  <line x1="715" y1="380" x2="715" y2="420" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="630" y="420" width="170" height="90" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="715" y="446" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">REJECTED</text>
  <text x="715" y="463" font-size="11" text-anchor="middle" fill="#7f1d1d">Short demo video</text>
  <text x="715" y="478" font-size="11" text-anchor="middle" fill="#7f1d1d">(duplicates content,</text>
  <text x="715" y="493" font-size="11" text-anchor="middle" fill="#7f1d1d">adds page weight)</text>

  <line x1="790" y1="330" x2="835" y2="330" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Gallery -->
  <g>
    <rect x="840" y="280" width="150" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="915" y="315" font-size="14" font-weight="700" text-anchor="middle" fill="#1e293b">Gallery</text>
    <text x="915" y="335" font-size="12" text-anchor="middle" fill="#64748b">Photographs</text>
    <text x="915" y="355" font-size="11" text-anchor="middle" fill="#64748b">Event scale &amp;</text>
    <text x="915" y="368" font-size="11" text-anchor="middle" fill="#64748b">legitimacy</text>
  </g>
  <line x1="990" y1="330" x2="1035" y2="330" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. CTA -->
  <g>
    <rect x="1040" y="280" width="150" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="1115" y="315" font-size="14" font-weight="700" text-anchor="middle" fill="#1e293b">Contact</text>
    <text x="1115" y="335" font-size="12" text-anchor="middle" fill="#4f46e5">Text + link</text>
    <text x="1115" y="355" font-size="11" text-anchor="middle" fill="#64748b">Converts interest</text>
    <text x="1115" y="368" font-size="11" text-anchor="middle" fill="#64748b">to contact</text>
  </g>

  <!-- legend -->
  <rect x="20" y="560" width="18" height="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="46" y="574" font-size="12" fill="#1e293b">Media element (image / video / interaction)</text>
  <rect x="20" y="590" width="18" height="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="46" y="604" font-size="12" fill="#1e293b">Text-only content</text>
  <rect x="20" y="620" width="18" height="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="46" y="634" font-size="12" fill="#1e293b">Rejected media element (critical selection requirement)</text>

  <text x="20" y="670" font-size="12" fill="#64748b">Audience: recruiters / potential teammates / academic evaluators. Objective: prove I can turn an unfamiliar</text>
  <text x="20" y="688" font-size="12" fill="#64748b">problem into a working, judged prototype under time pressure — with evidence, not just claims.</text>
</svg>
